name: 🐛 Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, plus what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally the exact `lintscope` command(s) and a minimal repo/config.
      placeholder: |
        1. `npx lintscope studio` in a repo with …
        2. …
    validations:
      required: true
  - type: dropdown
    id: linter
    attributes:
      label: Which linter(s)?
      multiple: true
      options: [ESLint, Biome, oxlint/OXC, "Not linter-specific"]
  - type: input
    id: version
    attributes:
      label: lintscope version
      placeholder: "e.g. 0.1.0 (npx lintscope --version)"
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version, package manager, browser (for studio UI issues).
      placeholder: "macOS 15 · Node 22 · pnpm 10 · Chrome 130"
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: CLI stderr (it prints a structured JSON line on error) and/or browser console.
      render: shell
