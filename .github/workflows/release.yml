name: release

on:
  push:
    branches: [main]
    # Only run the release when the published CLI — or a package it bundles —
    # changes. `lintscope` is the only npm package; it inlines core, schema,
    # api-schema, and studio-server (NOT ui / registry, which never ship to npm).
    # `.changeset/**` drives the version-PR flow; `pnpm-lock.yaml` covers
    # runtime-dependency bumps (chokidar / commander).
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/schema/**'
      - 'packages/api-schema/**'
      - 'packages/studio-server/**'
      - '.changeset/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: release
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Publish via Changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Publish or open release PR
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
